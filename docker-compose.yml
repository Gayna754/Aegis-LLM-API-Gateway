services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      REDIS_URL: redis://redis:6379
      DEMO_RATE_LIMIT: "60"
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  redis-data:
